# Build minimal static libraries with GCC in C99 mode.
name: Build minimal YAZ

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-minimal-yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool gcc make bison \
            tclsh xsltproc docbook docbook-xml docbook-xsl

      - name: Run buildconf
        run: ./buildconf.sh

      - name: Configure static libraries
        env:
          CC: gcc
          CFLAGS: -g -O2 -Wall -std=c99
        run: >
          ./configure --disable-shared --enable-static
          --without-xml2 --without-icu --without-gnutls
          --disable-tcpd --without-memcached --without-redis

      - name: Build and test
        run: make -j4 check

      - name: Show build and test failures
        if: failure()
        run: |
          for log in config.log test/test-suite.log ztest/test-suite.log; do
            if test -f "$log"; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
