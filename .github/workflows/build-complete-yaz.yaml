# Build full-featured shared libraries with GCC and create a distribution archive.
name: Build complete YAZ

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool gcc make bison \
            tclsh xsltproc docbook docbook-xml docbook-xsl \
            pkg-config libxslt1-dev libgnutls28-dev \
            libreadline-dev libwrap0-dev libicu-dev \
            libhiredis-dev libmemcached-dev

      - name: Run buildconf
        run: ./buildconf.sh

      - name: Configure shared libraries
        env:
          CC: gcc
          CFLAGS: -g -O2 -Wall
        run: >
          ./configure --enable-shared --disable-static
          --enable-tcpd --with-xslt --with-gnutls --with-icu
          --with-memcached --with-redis

      - name: Build and test
        run: make -j4 check

      - name: Build distribution archive
        run: make -j4 dist

      - name: Show build and test failures
        if: failure()
        run: |
          for log in config.log test/test-suite.log client/test-suite.log ztest/test-suite.log; do
            if test -f "$log"; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
